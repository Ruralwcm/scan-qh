<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Scan Điểm QH — TKMB v1.0</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Sans+Condensed:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f4f6f8;color:#222;min-height:100vh}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a3a5c,#d71920)}
.login-card{background:white;border-radius:12px;padding:32px 24px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.login-card h2{font-size:22px;color:#d71920;margin-bottom:4px}
.login-card .sub{font-size:13px;color:#888;margin-bottom:24px}
.login-card label{display:block;font-size:13px;font-weight:600;color:#555;margin-bottom:4px}
.login-card input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;margin-bottom:14px}
.login-card input:focus{outline:none;border-color:#d71920;box-shadow:0 0 0 3px rgba(31,78,121,.15)}
.err-msg{color:#dc3545;font-size:12px;margin-bottom:8px;display:none}
.app-wrap{display:none;flex-direction:column;min-height:100vh}
.topbar{background:#d71920;color:white;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.topbar .title{font-size:16px;font-weight:700}
.topbar .user{font-size:12px;opacity:.85}
.topbar button{background:rgba(255,255,255,.2);color:white;border:none;padding:6px 12px;border-radius:4px;font-size:12px;cursor:pointer}
.tabs{display:flex;background:white;border-bottom:1px solid #e0e0e0;position:sticky;top:48px;z-index:99}
.tab{padding:12px 16px;font-size:13px;font-weight:600;color:#888;border-bottom:2px solid transparent;cursor:pointer;text-align:center;flex:1}
.tab.active{color:#d71920;border-bottom-color:#d71920}
.page{display:none;padding:16px;flex:1}
.page.active{display:block}
.scan-hero{text-align:center;padding:24px 0}
.scan-btn{width:120px;height:120px;border-radius:50%;background:linear-gradient(145deg,#28a745,#20c997);color:white;border:none;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(40,167,69,.4);transition:transform .2s,box-shadow .2s;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.scan-btn:active{transform:scale(.93);box-shadow:0 2px 8px rgba(40,167,69,.3)}
.scan-btn.scanning{background:linear-gradient(145deg,#ffc107,#fd7e14);animation:pulse 1.5s infinite}
.scan-btn .icon{font-size:36px}
.scan-btn .txt{font-size:12px;opacity:.9}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,193,7,.5)}70%{box-shadow:0 0 0 20px rgba(255,193,7,0)}100%{box-shadow:0 0 0 0 rgba(255,193,7,0)}}
.gps-status{font-size:12px;color:#888;margin-top:12px}
.gps-status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ccc;margin-right:6px}
.gps-status.active .dot{background:#28a745;animation:pulse-dot 1.5s infinite}
@keyframes pulse-dot{50%{opacity:.4}}
.qh-list{margin-top:16px}
.qh-card{background:white;border-radius:8px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;transition:transform .15s}
.qh-card:active{transform:scale(.98)}
.qh-card .qh-code{font-weight:700;font-size:15px;color:#d71920}
.qh-card .qh-addr{font-size:12px;color:#666;margin-top:2px}
.qh-card .qh-meta{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.qh-badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.qh-badge.info{background:#e8f0fe;color:#d71920}
.qh-badge.near{background:#d4edda;color:#155724}
.no-results{text-align:center;padding:32px 16px;color:#888;font-size:14px}
.back-btn{background:none;border:none;color:#d71920;font-size:14px;font-weight:600;cursor:pointer;padding:0;display:flex;align-items:center;gap:4px;margin-bottom:16px}
.detail-header{background:white;border-radius:8px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.detail-header h3{font-size:16px;color:#d71920}
.detail-header .info-row{font-size:13px;color:#666;margin-top:4px}
.survey-form{background:white;border-radius:8px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px}
.survey-form h4{font-size:14px;color:#d71920;margin-bottom:12px;border-bottom:1px solid #eee;padding-bottom:8px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-row.full{grid-template-columns:1fr}
.form-row label{display:block;font-size:11px;font-weight:600;color:#555;margin-bottom:2px}
.form-row input,.form-row textarea,.form-row select{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:4px;font-size:13px}
.form-row input:focus,.form-row textarea:focus{outline:none;border-color:#d71920}
.form-row textarea{resize:vertical;min-height:60px}
.btn-submit{width:100%;padding:12px;background:#28a745;color:white;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}
.btn-submit:active{background:#218838}
.timeline{background:white;border-radius:8px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.timeline h4{font-size:14px;color:#d71920;margin-bottom:12px;border-bottom:1px solid #eee;padding-bottom:8px}
.tl-item{position:relative;padding-left:24px;padding-bottom:16px;border-left:2px solid #e0e0e0}
.tl-item:last-child{border-left-color:transparent}
.tl-item::before{content:'';position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:#d71920}
.tl-date{font-size:11px;color:#888}
.tl-body{font-size:13px;color:#333;margin-top:2px}
.tl-meta{font-size:11px;color:#888;margin-top:2px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:white;border-radius:8px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}
.stat-card .num{font-size:26px;font-weight:700;color:#d71920}
.stat-card .lbl{font-size:11px;color:#888;margin-top:2px}
.dash-table{background:white;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dash-table table{width:100%;border-collapse:collapse;font-size:12px}
.dash-table th{background:#f8f9fa;padding:8px;text-align:left;font-weight:600;border-bottom:2px solid #dee2e6}
.dash-table td{padding:8px;border-bottom:1px solid #eee}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:10px 20px;border-radius:20px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.toast.success{background:#28a745}
.toast.error{background:#dc3545}
.loading{text-align:center;padding:32px;color:#888}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid #e0e0e0;border-top-color:#d71920;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:480px){.form-row{grid-template-columns:1fr}.scan-btn{width:100px;height:100px}.stats-grid{grid-template-columns:1fr 1fr}}

@media (prefers-color-scheme: dark) {
  body{background:#0f1724;color:#e8ecf1}
  .card,.stat-card,.app-card,.modal,.confirm-box,.login-box{background:#1a2332;border-color:#2a3646}
  thead th{background:#1a2332;color:#cbd5e1;border-bottom-color:#2a3646}
  td{border-bottom-color:#2a3646}
  .sidebar{background:#0a2a24}
  .topbar{background:#b3121b}
  input,select,textarea{background:#1a2332;color:#e8ecf1;border-color:#2a3646}
}
</style>
</head>
<body>

<div id="loginWrap" class="login-wrap">
  <div class="login-card">
    <h2>🔍 Scan Diem QH</h2>
    <div class="sub">TKMB — Khao sat thuc dia</div>
    <label>Ma NV / Username</label>
    <input type="text" id="loginUser" placeholder="Nhap username..." autocomplete="username">
    <label>Mat khau</label>
    <input type="password" id="loginPass" placeholder="Nhap mat khau..." autocomplete="current-password">
    <div class="err-msg" id="loginErr"></div>
    <button class="btn-submit" onclick="doLogin()">Dang nhap</button>
    <div style="text-align:center;margin-top:12px;font-size:11px;color:#aaa">v1.0 · Rural Mien Bac</div>
  </div>
</div>

<div id="appWrap" class="app-wrap">
  <div class="topbar">
    <div>
      <div class="title">🔍 Scan Diem QH</div>
      <div class="user" id="userLabel">...</div>
    </div>
    <button onclick="doLogout()">Thoat</button>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="scan" onclick="switchTab('scan')">📍 Scan</div>
    <div class="tab" data-tab="dashboard" onclick="switchTab('dashboard')">📊 Tong quan</div>
  </div>
  <div class="page active" id="pageScan">
    <div class="scan-hero">
      <button class="scan-btn" id="scanBtn" onclick="doScan()"><span class="icon">📍</span><span class="txt">Scan QH</span></button>
      <div class="gps-status" id="gpsStatus"><span class="dot"></span> <span id="gpsText">San sang quet</span><div style="font-size:10px;color:#aaa;margin-top:2px" id="gpsCoords"></div></div>
    </div>
    <div id="scanResults"></div>
  </div>
  <div class="page" id="pageDashboard">
    <div class="stats-grid" id="dashStats"></div>
    <div class="dash-table" style="margin-top:12px">
      <div style="padding:12px;font-weight:600;font-size:13px;color:#d71920;border-bottom:1px solid #eee">🕒 Khao sat gan day</div>
      <table id="dashRecent"></table>
    </div>
  </div>
</div>

<div id="detailOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#f4f6f8;z-index:200;overflow-y:auto">
  <div style="padding:16px">
    <button class="back-btn" onclick="closeDetail()">← Quay ve</button>
    <div id="detailContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwqTPGvFQmVSJOYMmEOQHjOkXiKKacHaa7bIqshmnUnTTnDszMFPFRA0p-eBnK0dN_/exec';
const QH_DATA_URL = 'qh_points.json';
const SCAN_RADIUS_M = 100;

let token = localStorage.getItem('scan_qh_token') || '';
let user = JSON.parse(localStorage.getItem('scan_qh_user') || 'null');
let qhPoints = [];
let selectedQH = null;
let currentLat = null, currentLng = null;
let watchId = null;

(async function init() {
  if (token && user) {
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('appWrap').style.display = 'flex';
    document.getElementById('userLabel').textContent = user.display + ' (' + user.role + ')';
    await loadQHData();
    startGPS();
    loadDashboard();
  }
})();

async function loadQHData() {
  try {
    const resp = await fetch(QH_DATA_URL);
    qhPoints = await resp.json();
    console.log('Loaded ' + qhPoints.length + ' QH points');
  } catch(e) {
    console.error('Failed to load QH data', e);
    showToast('Khong tai duoc du lieu diem QH', 'error');
  }
}

async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginErr');
  if (!u || !p) { err.textContent = 'Vui long nhap day du'; err.style.display = 'block'; return; }
  try {
    const resp = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'login', username: u, password: p }) });
    const data = await resp.json();
    if (data.ok) {
      token = data.token;
      user = data.user;
      localStorage.setItem('scan_qh_token', token);
      localStorage.setItem('scan_qh_user', JSON.stringify(user));
      document.getElementById('loginWrap').style.display = 'none';
      document.getElementById('appWrap').style.display = 'flex';
      document.getElementById('userLabel').textContent = user.display + ' (' + user.role + ')';
      await loadQHData();
      startGPS();
      loadDashboard();
    } else {
      err.textContent = data.error || 'Dang nhap that bai';
      err.style.display = 'block';
    }
  } catch(e) {
    err.textContent = 'Loi ket noi, thu lai sau';
    err.style.display = 'block';
  }
}

function doLogout() {
  token = ''; user = null;
  localStorage.removeItem('scan_qh_token');
  localStorage.removeItem('scan_qh_user');
  if (watchId) navigator.geolocation.clearWatch(watchId);
  document.getElementById('appWrap').style.display = 'none';
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
}

function startGPS() {
  const status = document.getElementById('gpsStatus');
  const text = document.getElementById('gpsText');
  const coords = document.getElementById('gpsCoords');
  if (!navigator.geolocation) { text.textContent = 'Thiet bi khong ho tro GPS'; return; }
  status.classList.add('active');
  text.textContent = 'Dang lay vi tri...';
  watchId = navigator.geolocation.watchPosition(
    function(pos) {
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;
      text.textContent = 'GPS san sang (+-' + Math.round(pos.coords.accuracy) + 'm)';
      coords.textContent = currentLat.toFixed(6) + ', ' + currentLng.toFixed(6);
      status.classList.add('active');
    },
    function(err) {
      text.textContent = 'Canh bao ' + (err.code === 1 ? 'GPS bi tu choi' : err.code === 2 ? 'Khong co tin hieu GPS' : 'Loi GPS');
      status.classList.remove('active');
    },
    { enableHighAccuracy: true, maximumAge: 30000, timeout: 15000 }
  );
}

async function doScan() {
  const btn = document.getElementById('scanBtn');
  const results = document.getElementById('scanResults');
  if (!currentLat || !currentLng) { showToast('Dang cho tin hieu GPS...', 'error'); return; }
  if (qhPoints.length === 0) { showToast('Chua tai xong du lieu diem QH', 'error'); return; }

  btn.classList.add('scanning');
  btn.querySelector('.txt').textContent = 'Dang quet...';
  results.innerHTML = '<div class="loading"><div class="spinner"></div><div style="margin-top:8px;color:#888;font-size:12px">Dang quet ' + qhPoints.length + ' diem QH...</div></div>';

  setTimeout(function() {
    const nearby = findNearbyQH(currentLat, currentLng, SCAN_RADIUS_M);
    const allSorted = findAllSorted(currentLat, currentLng);
    btn.classList.remove('scanning');
    btn.querySelector('.txt').textContent = 'Scan QH';
    if (nearby.length > 0) {
      renderNearbyResults(nearby);
      if (navigator.vibrate) navigator.vibrate(200);
    } else {
      const nearest = allSorted[0];
      const dist = Math.round(nearest.dist);
      results.innerHTML = '<div class="no-results">' +
        '<div style="font-size:48px;margin-bottom:12px">📭</div>' +
        '<div style="font-weight:600">Khong co diem QH trong ' + SCAN_RADIUS_M + 'm</div>' +
        '<div style="margin-top:8px;font-size:13px;color:#888">Diem QH gan nhat: <b>' + nearest.qh + '</b> cach <b>' + dist + 'm</b></div>' +
        '<div style="font-size:12px;color:#aaa;margin-top:4px">' + nearest.t + ' · ' + nearest.h + '</div>' +
        '</div>';
    }
  }, 300);
}

function findNearbyQH(lat, lng, radiusM) {
  const results = [];
  for (let i = 0; i < qhPoints.length; i++) {
    const p = qhPoints[i];
    const d = haversine(lat, lng, p.lat, p.lng);
    if (d <= radiusM) results.push(Object.assign({}, p, {dist: d}));
  }
  results.sort(function(a,b) { return a.dist - b.dist; });
  return results;
}

function findAllSorted(lat, lng) {
  const all = [];
  for (let i = 0; i < qhPoints.length; i++) {
    const p = qhPoints[i];
    all.push(Object.assign({}, p, {dist: haversine(lat, lng, p.lat, p.lng)}));
  }
  all.sort(function(a,b) { return a.dist - b.dist; });
  return all.slice(0, 10);
}

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng/2) * Math.sin(dLng/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function renderNearbyResults(nearby) {
  let html = '<div style="font-weight:600;font-size:14px;color:#d71920;margin-bottom:8px">✅ Tim thay ' + nearby.length + ' diem QH trong ' + SCAN_RADIUS_M + 'm</div>';
  for (let i = 0; i < nearby.length; i++) {
    const p = nearby[i];
    html += '<div class="qh-card" onclick="openDetail(\'' + p.qh + '\')">' +
      '<div class="qh-code">' + p.qh + '</div>' +
      '<div class="qh-addr">📍 ' + [p.x, p.h, p.t].filter(Boolean).join(', ') + '</div>' +
      '<div class="qh-meta">' +
        '<span class="qh-badge near">📏 ' + Math.round(p.dist) + 'm</span>' +
        '<span class="qh-badge info">👤 ' + (p.gdv || '') + '</span>' +
        '<span class="qh-badge info">' + (p.vung || '') + '</span>' +
      '</div>' +
    '</div>';
  }
  document.getElementById('scanResults').innerHTML = html;
}

function openDetail(maQH) {
  selectedQH = qhPoints.find(function(p) { return p.qh === maQH; });
  if (!selectedQH) return;
  document.getElementById('detailOverlay').style.display = 'block';
  window.scrollTo(0, 0);
  const today = new Date().toISOString().split('T')[0];
  let html = '';
  html += '<div class="detail-header">';
  html += '<h3>' + selectedQH.qh + '</h3>';
  html += '<div class="info-row">📍 ' + [selectedQH.x, selectedQH.h, selectedQH.t].filter(Boolean).join(', ') + '</div>';
  html += '<div class="info-row">👤 GDV: ' + (selectedQH.gdv || '—') + ' · QLKV: ' + (selectedQH.qlkv || '—') + '</div>';
  html += '<div class="info-row">🏷 ' + (selectedQH.vung || '') + ' · ' + (selectedQH.cq || '') + '</div>';
  html += '</div>';
  html += '<div class="survey-form">';
  html += '<h4>📝 Ghi nhan khao sat lan nay</h4>';
  html += '<div class="form-row">';
  html += '<div><label>Ngay khao sat</label><input type="date" id="fNgayKS" value="' + today + '"></div>';
  html += '<div><label>Gia thue khu vuc (tr/th)</label><input type="number" id="fGiaThueKV" placeholder="VD: 12"></div>';
  html += '</div>';
  html += '<div class="form-row full">';
  html += '<div><label>Dia chi nha</label><input type="text" id="fDiaChiNha" placeholder="So nha, duong, phuong/xa..."></div>';
  html += '</div>';
  html += '<div class="form-row">';
  html += '<div><label>Dien tich (m2)</label><input type="number" id="fDienTich" placeholder="VD: 120"></div>';
  html += '<div><label>Mat tien (m)</label><input type="number" id="fMatTien" placeholder="VD: 8"></div>';
  html += '</div>';
  html += '<div class="form-row">';
  html += '<div><label>Gia thue nha (tr/th)</label><input type="number" id="fGiaThue" placeholder="VD: 15"></div>';
  html += '<div><label>Co hoi ghep can</label><select id="fCoHoiGhepCan"><option value="">— Chon —</option><option value="Co">✅ Co the ghep</option><option value="Khong">❌ Khong</option><option value="Can KS them">🔄 Can KS them</option></select></div>';
  html += '</div>';
  html += '<div class="form-row full">';
  html += '<div><label>Ghi chu</label><textarea id="fGhiChu" placeholder="Thong tin them ve MB, chu nha, tinh trang khu vuc..."></textarea></div>';
  html += '</div>';
  html += '<button class="btn-submit" onclick="saveSurvey()">💾 Luu khao sat</button>';
  html += '</div>';
  html += '<div class="timeline">';
  html += '<h4>📋 Lich su khao sat</h4>';
  html += '<div id="timelineContent"><div style="text-align:center;color:#aaa;font-size:12px;padding:16px">Dang tai...</div></div>';
  html += '</div>';
  document.getElementById('detailContent').innerHTML = html;
  loadHistory(maQH);
}

function closeDetail() {
  document.getElementById('detailOverlay').style.display = 'none';
  selectedQH = null;
}

async function saveSurvey() {
  const data = {
    action: 'saveSurvey',
    token: token,
    maQH: selectedQH.qh,
    ngayKS: document.getElementById('fNgayKS').value,
    giaThueKV: document.getElementById('fGiaThueKV').value,
    diaChiNha: document.getElementById('fDiaChiNha').value,
    dienTich: document.getElementById('fDienTich').value,
    matTien: document.getElementById('fMatTien').value,
    giaThue: document.getElementById('fGiaThue').value,
    coHoiGhepCan: document.getElementById('fCoHoiGhepCan').value,
    ghiChu: document.getElementById('fGhiChu').value,
    lat: currentLat,
    lng: currentLng
  };
  try {
    const resp = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(data) });
    const result = await resp.json();
    if (result.ok) {
      showToast('✅ Da luu khao sat!', 'success');
      loadHistory(selectedQH.qh);
    } else {
      showToast('❌ ' + (result.error || 'Loi luu'), 'error');
    }
  } catch(e) {
    showToast('❌ Loi ket noi', 'error');
  }
}

async function loadHistory(maQH) {
  try {
    const resp = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getHistory', token: token, maQH: maQH }) });
    const data = await resp.json();
    const surveys = data.surveys || [];
    let html = '';
    if (surveys.length === 0) {
      html = '<div style="text-align:center;color:#aaa;font-size:12px;padding:16px">Chua co lan khao sat nao</div>';
    } else {
      for (let i = 0; i < surveys.length; i++) {
        const s = surveys[i];
        html += '<div class="tl-item">';
        html += '<div class="tl-date">📅 ' + s.ngayKS + ' · ' + s.nguoiKS + '</div>';
        if (s.diaChiNha) {
          html += '<div class="tl-body">🏠 ' + s.diaChiNha;
          if (s.dienTich) html += ' · ' + s.dienTich + 'm2';
          if (s.matTien) html += ' · MT ' + s.matTien + 'm';
          html += '</div>';
          html += '<div class="tl-meta">💲 Gia thue: ' + (s.giaThue || '—') + ' tr/th';
          if (s.giaThueKV) html += ' · Gia KV: ' + s.giaThueKV + ' tr/th';
          html += '</div>';
        }
        if (s.coHoiGhepCan) html += '<div class="tl-meta">🔀 Co hoi ghep can: ' + s.coHoiGhepCan + '</div>';
        if (s.ghiChu) html += '<div class="tl-body" style="font-size:12px;color:#555">📝 ' + s.ghiChu + '</div>';
        html += '</div>';
      }
    }
    document.getElementById('timelineContent').innerHTML = html;
  } catch(e) {
    document.getElementById('timelineContent').innerHTML = '<div style="text-align:center;color:#888;font-size:12px;padding:16px">Khong tai duoc lich su</div>';
  }
}

async function loadDashboard() {
  try {
    const resp = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getDashboard', token: token }) });
    const data = await resp.json();
    const s = data.stats || {};
    const total = qhPoints.length;
    const pct = total > 0 ? Math.round(s.daKhaoSat / total * 100) : 0;
    document.getElementById('dashStats').innerHTML =
      '<div class="stat-card"><div class="num">' + s.daKhaoSat + '</div><div class="lbl">✅ Da khao sat</div></div>' +
      '<div class="stat-card"><div class="num">' + total + '</div><div class="lbl">📍 Tong diem QH</div></div>' +
      '<div class="stat-card"><div class="num" style="color:#28a745">' + pct + '%</div><div class="lbl">Ty le</div></div>';
    const recent = s.recentSurveys || [];
    let rows = '';
    for (let i = 0; i < recent.length; i++) {
      rows += '<tr><td>' + recent[i].ngayKS + '</td><td><b>' + recent[i].maQH + '</b></td><td>' + (recent[i].diaChiNha || '—') + '</td><td>' + recent[i].nguoiKS + '</td></tr>';
    }
    document.getElementById('dashRecent').innerHTML =
      '<thead><tr><th>Ngay</th><th>Diem QH</th><th>Dia chi</th><th>Nguoi KS</th></tr></thead><tbody>' + (rows || '<tr><td colspan="4" style="text-align:center;color:#aaa">Chua co du lieu</td></tr>') + '</tbody>';
  } catch(e) {}
}

function switchTab(tabName) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.querySelector('.tab[data-tab="' + tabName + '"]').classList.add('active');
  document.getElementById('page' + (tabName === 'scan' ? 'Scan' : 'Dashboard')).classList.add('active');
  if (tabName === 'dashboard') loadDashboard();
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '') + ' show';
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.getElementById('loginWrap').style.display !== 'none') doLogin();
  if (e.key === 'Escape' && document.getElementById('detailOverlay').style.display === 'block') closeDetail();
});
</script>
